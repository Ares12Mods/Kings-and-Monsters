plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files and directory entries
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Logs the one-shot animation sync as it happens (see AnimationDebug); never per frame.
            systemProperty 'kingsandmonsters.animdebug', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    complementaryShader
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // JEI — optional; API for compile time, full jar available in dev for testing
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // GeckoLib — required for animated models and entities
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"

    // Better Combat — optional; provides combat animations and weapon attributes
    compileOnly "maven.modrinth:better-combat:${better_combat_version}"
    localRuntime "maven.modrinth:better-combat:${better_combat_version}"
    localRuntime "maven.modrinth:playeranimator:${player_animator_version}"
    localRuntime "maven.modrinth:cloth-config:${cloth_config_version}"

    // Curios API — for custom equipment slots (rings, amulets, cloaks, etc.)
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Jade — optional entity/block info overlay
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // Patchouli - optional at runtime (guidebook only); compile-only here, full runtime for dev.
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Forgematica (NeoForge Litematica port) — development-only structure testing.
    // MaFgLib is its required client-side library. Neither is bundled or required by the mod.
    localRuntime "maven.modrinth:forgematica:${forgematica_version}"
    localRuntime "maven.modrinth:mafglib:${mafglib_version}"

    // JourneyMap — development-only worldgen and structure-placement testing.
    // Modrinth project/version IDs pin the 1.21.1 NeoForge 6.0.9 release.
    localRuntime "maven.modrinth:lfHFW1mp:${journeymap_version}"

    // spark — development-only profiler for finding lag (/spark profiler start).
    // Modrinth project/version IDs pin the 1.10.124 NeoForge 1.21.1 release.
    localRuntime "maven.modrinth:l6YH9Als:${spark_version}"

    // Iris + Sodium — development-only shader support. The shader pack itself is copied below.
    localRuntime "maven.modrinth:iris:${iris_version}"
    localRuntime "maven.modrinth:sodium:${sodium_version}"
    complementaryShader "maven.modrinth:HVnmMxH1:${complementary_shader_version}@zip"

}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    includeEmptyDirs = false
}

// Make the checked-in vanilla structure templates available to Forgematica without maintaining
// a second hand-copied set. Forgematica's Schematic Manager can import these .nbt files and save
// editable .litematic working copies alongside them.
def structureSourceDirectory = layout.projectDirectory.dir('src/main/resources/data/kingsandmonsters/structure')
def structureSchematicDirectory = layout.projectDirectory.dir('run/schematics/kingsandmonsters')

tasks.register('syncStructureSchematics', Sync) {
    group = 'kings and monsters development'
    description = 'Copies the current Ogre structure NBT files into the Forgematica schematics folder.'
    from(structureSourceDirectory)
    into(structureSchematicDirectory)
    include('**/*.nbt')
}

tasks.register('importStructureSchematics', Copy) {
    group = 'kings and monsters development'
    description = 'Copies edited Ogre NBT templates from Forgematica back into mod resources.'
    from(structureSchematicDirectory)
    into(structureSourceDirectory)
    include('**/*.nbt')
}

tasks.register('syncComplementaryShaders', Copy) {
    group = 'kings and monsters development'
    description = 'Installs the pinned Complementary Reimagined shader pack for runClient.'
    from(configurations.complementaryShader)
    into(layout.projectDirectory.dir('run/shaderpacks'))
    rename { 'ComplementaryReimagined_r5.9.3.zip' }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn(tasks.named('syncStructureSchematics'))
    dependsOn(tasks.named('syncComplementaryShaders'))
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file('repo').toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xlint:deprecation'])
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
